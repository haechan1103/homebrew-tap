name: Update Kavranta Cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  attestations: read

concurrency:
  group: update-kavranta-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synchronize with the latest immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-kavranta-cask.sh

      - name: Audit the Cask
        run: |
          brew tap haechan1103/tap "${GITHUB_WORKSPACE}"
          brew style haechan1103/tap/kavranta
          brew audit --cask --strict haechan1103/tap/kavranta

      - name: Commit an updated version
        run: |
          if git diff --quiet -- Casks/kavranta.rb; then
            echo "The Cask is already current."
            exit 0
          fi
          version="$(ruby -ne 'puts $1 if $_ =~ /^  version "([^"]+)"/' Casks/kavranta.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kavranta.rb
          git commit -m "chore: update Kavranta to ${version}"
          git push
